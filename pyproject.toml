[project]
name = "py-der-61850"
version = "0.1.0"
description = "IEC 61850-like data model, reflection, protocol clients and REC/BESS optimization logic for distributed energy resources (DER)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Mattia Pasqui", email = "mattia.pasqui@enyr.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "numpy>=2.3.0",
    "paho-mqtt>=2.1.0",
    "pandas>=2.3.0",
    "pydantic>=2.11.7",
    "pyomo>=6.9.2",
    "influxdb_client==1.49.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
# Integration tests call real external services (GME, InfluxDB, FusionSolar): opt in with
# `-m integration --envfile .env`. The default run is offline and never loads .env.
addopts = "-m 'not integration'"
markers = ["integration: calls real external services, excluded by default"]
env_files = []
#addopts = "--cov=src/py_der_61850 --cov-report=xml --cov-report=term-missing"
